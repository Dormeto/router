# The workloads of the Kubernetes integration tests (scripts/kind-up.sh): web (2 replicas), api scaled by KEDA, the
# customer's Ingress of web in a group and a lone Ingress (no controller in kind: objects only).
apiVersion: v1
kind: Namespace
metadata:
  name: dormeto-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dormeto-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dormeto-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
# KEDA keeps api at 1 replica all the time (a cron trigger always active).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-scaler
  namespace: dormeto-test
spec:
  scaleTargetRef:
    name: api
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 5
  triggers:
    - type: cron
      metadata:
        timezone: Etc/UTC
        start: "0 * * * *"
        end: "59 * * * *"
        desiredReplicas: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dormeto-test
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: dormeto-test
  annotations:
    alb.ingress.kubernetes.io/group.name: test-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: web.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solo
  namespace: dormeto-test
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: solo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
